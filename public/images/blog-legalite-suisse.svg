<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0B0C10"/>
  <circle cx="400" cy="300" r="300" fill="#DC2626" fill-opacity="0.1" filter="blur(80px)"/>
  <circle cx="800" cy="300" r="300" fill="#2563EB" fill-opacity="0.1" filter="blur(80px)"/>
  
  <!-- Scale of Justice / Swiss Law Icon -->
  <g transform="translate(530, 110)">
    <rect width="140" height="140" rx="35" fill="#161926" stroke="#DC2626" stroke-width="3"/>
    <path d="M70 35 V105 M40 55 L70 35 L100 55 M40 85 C40 95 60 95 60 85 Z M80 85 C80 95 100 95 100 85 Z" stroke="#DC2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

