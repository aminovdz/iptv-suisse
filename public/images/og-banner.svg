<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0B0C10"/>
  <circle cx="600" cy="315" r="400" fill="#DC2626" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="950" cy="150" r="250" fill="#2563EB" fill-opacity="0.08" filter="blur(60px)"/>
  
  <!-- Swiss Flag Shield -->
  <g transform="translate(540, 140)">
    <rect width="120" height="120" rx="30" fill="#DC2626" stroke="#EF4444" stroke-width="4"/>
    <!-- Swiss Cross -->
    <rect x="50" y="24" width="20" height="72" rx="4" fill="#FFFFFF"/>
    <rect x="24" y="50" width="72" height="20" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <text x="600" y="340" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="-0.03em">
    IPTV SUISSE
  </text>
  
  <text x="600" y="400" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.1em">
    STREAMING 4K ULTRA HD · ANTI-FREEZE 9.8™
  </text>

  <text x="600" y="460" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" text-anchor="middle">
    Chaînes Suisses &amp; Sport en Direct · Dès CHF 8.- · Formule Recommandée 12 Mois CHF 55.-
  </text>

  <!-- Bottom Badges -->
  <g transform="translate(360, 510)">
    <rect width="480" height="50" rx="25" fill="#161926" stroke="rgba(255,255,255,0.1)"/>
    <text x="240" y="32" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      🇨🇭 Serveurs Optimisés Swisscom, Sunrise &amp; Salt · Sans Engagement
    </text>
  </g>
</svg>
