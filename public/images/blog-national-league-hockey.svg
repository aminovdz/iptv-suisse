<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0B0C10"/>
  <circle cx="500" cy="300" r="350" fill="#DC2626" fill-opacity="0.12" filter="blur(90px)"/>
  <circle cx="900" cy="250" r="280" fill="#F59E0B" fill-opacity="0.08" filter="blur(80px)"/>

  <!-- Hockey & Sports Graphic -->
  <g transform="translate(530, 110)">
