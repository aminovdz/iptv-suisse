    <path d="M45 45 H95 V70 C95 85 70 95 70 95 C70 95 45 85 45 70 Z M55 105 H85" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Title & Badge -->
