<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#0B0C10"/>
  <circle cx="960" cy="400" r="600" fill="#DC2626" fill-opacity="0.08" filter="blur(120px)"/>
  <circle cx="1500" cy="200" r="400" fill="#2563EB" fill-opacity="0.05" filter="blur(100px)"/>
  <!-- Subdued Grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)" />
</svg>
