<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="swissRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#DC2626" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Shield/TV Box -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#swissRed)" filter="url(#glow)"/>
  <rect x="44" y="44" width="424" height="424" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>
  <!-- Swiss Cross -->
  <rect x="216" y="128" width="80" height="256" rx="14" fill="#FFFFFF"/>
  <rect x="128" y="216" width="256" height="80" rx="14" fill="#FFFFFF"/>
  <!-- TV Antenna / Play badge accent -->
  <circle cx="396" cy="116" r="28" fill="#2563EB"/>
  <polygon points="390,104 408,116 390,128" fill="#FFFFFF"/>
</svg>
